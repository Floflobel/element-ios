name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout v1.11.35
        uses: actions/checkout@v4
        with:
          repository: element-hq/element-ios
          ref: v1.11.35
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen

      - name: Verify XcodeGen
        run: xcodegen version

      - name: Install Bundler
        run: gem install bundler

      - name: Install Ruby gems
        run: bundle install

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify generated project
        run: ls -la Riot.xcodeproj

      - name: Install CocoaPods dependencies
        run: bundle exec pod install --repo-update

      - name: Build unsigned archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace Riot.xcworkspace \
            -scheme Riot \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/Element.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Create IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -R "$RUNNER_TEMP/Element.xcarchive/Products/Applications/Riot.app" "$RUNNER_TEMP/Payload/"
          cd $RUNNER_TEMP
          /usr/bin/zip -r Element-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Element-unsigned.ipa
          path: ${{ runner.temp }}/Element-unsigned.ipa
          retention-days: 7
